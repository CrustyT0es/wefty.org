  <!-- ===== Wefty 2.0 glass: the splash screen (CSS). Shown only while html[data-look="glass"] is set (js/look.js, in the head,
       before the first frame); the classic look never shows it. It is here, inline, because the page's security rules allow
       inline styles but not inline scripts: it paints before any script has loaded. glass/loading.js ends it (V.splash.done(),
       called when the first screen is drawn), and the animation at the bottom ends it by itself after 6 s if no script ever runs. -->
  <style id="g-splash-css">
html[data-look="glass"] #g-splash { display: block !important; position: fixed; inset: 0; z-index: 88; overflow: hidden; pointer-events: none; background: #0b0918; animation: gs-hard .5s linear 6s both; }
html[data-look="glass"][data-theme="light"] #g-splash { background: #efe9ff; }

html[data-look="glass"] #g-splash .gs-aurora { position: absolute; inset: -25%; animation: gs-drift 7s ease-in-out infinite alternate;
  background: radial-gradient(38% 26% at 18% 14%, rgba(132, 86, 224, .74), rgba(132, 86, 224, 0) 70%), radial-gradient(34% 24% at 88% 30%, rgba(92, 78, 222, .48), rgba(92, 78, 222, 0) 70%),
    radial-gradient(46% 30% at 52% 82%, rgba(170, 92, 240, .31), rgba(170, 92, 240, 0) 70%), radial-gradient(30% 22% at 8% 62%, rgba(80, 60, 190, .36), rgba(80, 60, 190, 0) 70%); }
html[data-look="glass"][data-theme="light"] #g-splash .gs-aurora {
  background: radial-gradient(38% 26% at 18% 14%, rgba(150, 105, 255, .62), rgba(150, 105, 255, 0) 70%), radial-gradient(34% 24% at 88% 30%, rgba(186, 140, 255, .46), rgba(186, 140, 255, 0) 70%),
    radial-gradient(46% 30% at 52% 82%, rgba(255, 150, 220, .42), rgba(255, 150, 220, 0) 70%), radial-gradient(30% 22% at 8% 62%, rgba(140, 110, 250, .40), rgba(140, 110, 250, 0) 70%); }
html[data-look="glass"][data-black] #g-splash .gs-aurora { display: none; }
html[data-look="glass"] #g-splash .gs-stage { --gs: clamp(96px, 29vmin, 148px); --gs-thread: #d9ceff; position: absolute; left: 50%; top: 46%; width: var(--gs); height: var(--gs);
  margin: calc(var(--gs) / -2) 0 0 calc(var(--gs) / -2); perspective: calc(var(--gs) * 5.2); animation: gs-fade .24s cubic-bezier(.2, .7, .3, 1) both; will-change: transform, opacity; }

html[data-look="glass"] #g-splash .gs-w1 { transform: translateZ(calc(var(--gs) * .03)) scale(.99423); }

html[data-look="glass"] #g-splash .gs-th { left: calc(var(--gs) * -1.375); width: calc(var(--gs) * 3.75); transform: translateZ(calc(var(--gs) * .055)) scale(.98942);

/* The way out: the logo breathes in a touch, then shrinks and lifts away while it fades; the veil dissolves behind it, so the
   first screen (which rises in as this starts) comes up through it. The entrance's own animations are never replaced here
   (the stage and the veil carry the exit), so a quick start that leaves mid-spin does not stop the spin. */
html[data-look="glass"] #g-splash.gs-out { animation: gs-bye .44s cubic-bezier(.4, 0, .2, 1) both; }
html[data-look="glass"] #g-splash.gs-out .gs-stage { animation: gs-up .42s linear both; }
/* lite: fewer slabs, no sway, no wave, quicker; calm (and a system that asks for less motion): the logo just fades in, face on */
html[data-look="glass"].lite #g-splash .gs-s:nth-of-type(even) { display: none; }
html[data-look="glass"].lite #g-splash .gs-aurora { animation: none; }
html[data-look="glass"].lite #g-splash .gs-logo { animation: gs-turn .6s linear both; }
html[data-look="glass"].lite #g-splash .gs-glint { display: none; }
html[data-look="glass"].lite #g-splash .gs-th { animation: none; }

html[data-look="glass"].lite #g-splash.gs-out { animation-duration: .3s; }
html[data-look="glass"].lite #g-splash.gs-out .gs-stage { animation-duration: .28s; }
/* a main thread that can hardly draw (loading.js adds gs-slow): the turn runs on the compositor and goes on whatever the page
   is doing, so it is never cut; only the thread, which is painted on the main thread, stops drawing itself and just shows */
html[data-look="glass"].gs-slow #g-splash .gs-th path { animation: none; stroke-dashoffset: 0; }
html[data-look="glass"].calm #g-splash .gs-aurora, html[data-look="glass"].calm #g-splash .gs-glint, html[data-look="glass"].calm #g-splash .gs-ground, html[data-look="glass"].calm #g-splash .gs-halo { animation: none; will-change: auto; }
html[data-look="glass"].calm #g-splash .gs-glint { display: none; }
html[data-look="glass"].calm #g-splash .gs-logo { animation: none; will-change: auto; }
html[data-look="glass"].calm #g-splash .gs-stage { animation: gs-fade .12s linear both; }
html[data-look="glass"].calm #g-splash .gs-th { animation: none; }
html[data-look="glass"].calm #g-splash .gs-th path { animation: none; stroke-dashoffset: 0; }
html[data-look="glass"].calm #g-splash.gs-out { animation: gs-bye .12s linear both; }
html[data-look="glass"].calm #g-splash.gs-out .gs-stage { animation: none; }
@media (prefers-reduced-motion: reduce) {
  html[data-look="glass"] #g-splash .gs-aurora, html[data-look="glass"] #g-splash .gs-ground, html[data-look="glass"] #g-splash .gs-halo { animation: none; will-change: auto; }
  html[data-look="glass"] #g-splash .gs-glint { display: none; }
  html[data-look="glass"] #g-splash .gs-logo { animation: none; will-change: auto; }
  html[data-look="glass"] #g-splash .gs-stage { animation: gs-fade .12s linear both; }
  html[data-look="glass"] #g-splash .gs-th { animation: none; }
  html[data-look="glass"] #g-splash .gs-th path { animation: none; stroke-dashoffset: 0; }

/* The entrance is sampled from damped springs (design: ry zeta .55, rx .40, rz .40, scale .38, rise .42, each with its own
   frequency and start, every channel exactly at rest at .9 s), so it is one continuous curve: the keyframes are 30 ms
   apart and the easing between them is linear (never ease-in-out per keyframe: that stops the spin at every keyframe).
   The thread's plane (gs-lag, compositor only) trails the W through a looser spring of its own, slides in from behind it and
   swells and settles; only its stroke is drawn on the main thread (a second main-thread animation on top made frames wait). gs-sway starts and ends at rest, so the hold's drift leaves no kink. */
